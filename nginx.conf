# This is the Nginx configuration for the Resume Builder application.
# It is used for running a production-like server on your Windows machine for testing.
# On your final Ubuntu server, this configuration is created by project-setup.sh.

server {
    listen 80;
    server_name herring-meet-seasnail.ngrok-free.app localhost;

    # --- Frontend Serving ---
    location / {
        # This is the path to your **built** frontend files.
        # It's important to use the full, absolute path for your Windows machine.
        root D:/Resume_builder/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # --- Backend API Proxy ---
    # This block forwards all requests for '/api/...' to your backend server.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static Files from Backend ---
    # This handles any files served directly from your backend's static folder.
    location /static/ {
        # This path must also be absolute for Windows.
        alias D:/Resume_builder/backend/static/;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
} 