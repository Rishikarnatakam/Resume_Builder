# Netlify Build Configuration for ResumeCraft Frontend

[build]
  # Build command for the React application
  command = "npm run build"

  # Directory that contains the built site files
  publish = "dist/"

[context.production.environment]
  # The public URL of your Supabase project
  VITE_SUPABASE_URL = "https://[YOUR_PROJECT_REF].supabase.co"

  # The public 'anon' key for your Supabase project
  VITE_SUPABASE_ANON_KEY = "your_supabase_anon_key"

  # The URL of your deployed backend API from Render
  VITE_API_BASE_URL = "https://your-backend-name.onrender.com/api"

  # The build environment for Vite
  VITE_NODE_ENV = "production" 